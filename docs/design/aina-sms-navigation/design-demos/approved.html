    function customerPage(){const label=state.role==='Sales'?'Buku Pelanggan Saya':state.role==='Supervisor'?'Pelanggan Tim':'Pelanggan';const filtered=customers.filter(c=>(state.filter==='all'||c.state===state.filter)&&(`${c.name} ${c.model}`.toLowerCase().includes(state.query.toLowerCase())));const rows=filtered.map(c=>`<tr data-customer="${c.id}" tabindex="0"><td><strong>${c.name}</strong><span>${c.id}</span></td><td>${c.model}</td><td><span class="status ${c.state==='late'?'late':''}">${c.stage}</span></td><td><strong>${c.next}</strong><span>${c.due}</span></td><td>${c.last}</td></tr>`).join('');const cards=filtered.map(c=>`<button class="mobile-card" data-customer="${c.id}"><span class="mobile-card-top"><strong>${c.name}</strong><span class="status ${c.state==='late'?'late':''}">${c.stage}</span></span><span class="mobile-card-bottom"><span>${c.model}</span><span>${c.due}</span></span><span class="mobile-card-bottom">${c.next}</span></button>`).join('');return pageHead(label,'Cari pelanggan, lihat kontak terakhir, lalu lanjutkan tindakan berikutnya.','<button class="primary" data-toast="Form pelanggan baru dibuka">Tambah pelanggan</button>')+`<div class="toolbar"><div class="tools-left"><label class="search">${icon('search')}<span class="sr-only">Cari pelanggan</span><input id="searchInput" type="search" placeholder="Cari nama atau model" value="${state.query}"></label><label><span class="sr-only">Filter follow-up</span><select class="filter" id="filterSelect"><option value="all">Semua follow-up</option><option value="today" ${state.filter==='today'?'selected':''}>Hari ini</option><option value="late" ${state.filter==='late'?'selected':''}>Terlambat</option><option value="scheduled" ${state.filter==='scheduled'?'selected':''}>Terjadwal</option></select></label></div><span class="result-count">${filtered.length} pelanggan · Data contoh</span></div><section class="table-wrap"><table class="data-table"><thead><tr><th>Pelanggan</th><th>Minat</th><th>Tahap</th><th>L     function closeOverlay(){const o=$('#detailOverlay');o.classList.remove('open');o.setAttribute('aria-hidden','true');document.body.style.overflow='';requestAnimationFrame(()=>{window.scrollTo({top:state.savedScroll,behavior:'auto'});state.lastFocus?.focus?.()})}
    function closeMore(){const o=$('#moreOverlay');o.classList.remove('open');o.setAttribute('aria-hidden','true');document.body.style.overflow=''}
    function trapFocus(container,e){const focusable=$$('button:not([disabled]),input:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])').filter(x=>container.contains(x)&&x.offsetParent!==null);if(!focusable.length)return;const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    function renderAuth(type){$('#appShell').hidden=true;$('#mobileNav').style.display='none';$('#authStage').classList.add('active');const invite=type==='invite';$('#authCard').innerHTML=`<div class="auth-brand"><span class="brand-mark">DS</span><strong>DealDrive Supervisor</strong></div><h1>${invite?'Aktifkan akun Anda':'Masuk'}</h1><p>${invite?'Undangan untuk bergabung ke Tim Anggrek sebagai Sales.':'Gunakan akun dealer yang telah diundang.'}</p>${invite?'<div class="field"><label for="authName">Nama lengkap</label><input id="authName" value="Rina Pratama" autocomplete="name"></div>':''}<div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" value="rina@example.test" autocomplete="email"></div><div class="field"><label for="authPassword">${invite?'Buat password':'Password'}</label><input id="authPassword" type="password" autocomplete="${invite?'new-password':'current-password'}"><button class="text-btn" type="button" data-toggle-password style="margin-top:6px">Tampilkan password</button><small>${invite?'Minimal 12 karakter; paste dan password manager didukung.':'Pemulihan password tersedia bila diperlukan.'}</small></div><button class="primary" data-auth-action>${invite?'Aktifkan akun':'Masuk'}</button><div class="auth-foot">Data contoh · bukan akun nyata</div>`}
    function renderStates(){$('#appShell').hidden=false;$('#mobileNav').style.display='';$('#authStage').classList.remove('active');state.page='Beranda';state.mode=$('#stateSelect').value;render()}
    function handleSurface(){const value=$('#surfaceSelect').value;if(value==='login'||value==='invite')renderAuth(value);else{state.mode=value==='states'?$('#stateSelect').value:'normal';$('#stateSelect').disabled=value!=='states';$('#appShell').hidden=false;$('#mobileNav').style.display='';$('#authStage').classList.remove('active');render()}}
    document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}const more=e.target.closest('[data-more]');if(more){const o=$('#moreOverlay');o.classList.add('open');o.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('#moreList button')?.focus();return}const customer=e.target.closest('[data-customer]');if(customer){openCustomer(customer.dataset.customer,customer);return}const tx=e.target.closest('[data-open-tx]');if(tx){openTransaction(tx.dataset.openTx,tx);return}const tab=e.target.closest('[data-detail-tab]');if(tab){$$('[data-detail-tab]').forEach(x=>x.classList.toggle('active',x===tab));state.detailTab=tab.dataset.detailTab;if(state.detail.type==='tx')renderDetailBody();else if(tab.dataset.detailTab==='history')$('#detailBody').innerHTML=`<div class="timeline"><div class="event"><p>Follow-up dijadwalkan.</p><time>Kemarin · Aktivitas</time></div><div class="event"><p>Minat kendaraan dicatat.</p><time>23 Oktober · Transaksi</time></div></div>`;return}const a=e.target.closest('[data-analysis]');if(a){$$('[data-analysis]').forEach(x=>x.classList.toggle('active',x===a));const model=a.dataset.analysis==='model';$('#analysisTitle').textContent=model?'Kontribusi berdasarkan model':'Kontribusi berdasarkan sumber';$('#analysisBars').innerHTML=model?bar('Model A',21,21)+bar('Model B',16,21)+bar('Model C',12,21):bar('Referral',18,18)+bar('Walk-in',14,18)+bar('Media sosial',10,18)+bar('Pameran',7,18);return}const toggle=e.target.closest('[data-toggle-password]');if(toggle){const input=$('#authPassword'),show=input.type==='password';input.type=show?'text':'password';toggle.textContent=show?'Sembunyikan password':'Tampilkan password';input.focus();return}const toast=e.target.closest('[data-toast]');if(toast)showToast(toast.dataset.toast);if(e.target.closest('[data-retry]')){state.mode='normal';$('#stateSelect').value='normal';render()}if(e.target.closest('[data-auth-action]'))showToast('Aksi autentikasi contoh berhasil dijalankan.')});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#detailOverlay').classList.contains('open'))closeOverlay();else closeMore()}if(e.key==='Tab'&&$('#detailOverlay').classList.contains('open'))trapFocus($('#detailOverlay'),e);else if(e.key==='Tab'&&$('#moreOverlay').classList.contains('open'))trapFocus($('#moreOverlay'),e);if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-customer],tr[data-open-tx]')){e.preventDefault();e.target.click()}});
    $('#roleSelect').addEventListener('change',e=>{state.role=e.target.value;state.page='Beranda';state.query='';state.filter='all';render()});$('#notificationButton').addEventListener('click',()=>navigate('Notifikasi'));$('#closeDetail').addEventListener('click',closeOverlay);$('#closeMore').addEventListener('click',closeMore);$('#moreOverlay').addEventListener('click',e=>{if(e.target===$('#moreOverlay'))closeMore()});$('#detailOverlay').addEventListener('click',e=>{if(e.target===$('#detailOverlay'))closeOverlay()});$('#surfaceSelect').addEventListener('change',handleSurface);$('#stateSelect').addEventListener('change',renderStates);$('#stateSelect').disabled=true;render();
  </script>
  <script src="approved-enhancements.js"></script>
</body>
