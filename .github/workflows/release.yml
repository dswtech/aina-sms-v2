name: production-release

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: aina-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://aiia.toyotabandung.web.id
    steps:
      - name: Checkout reviewed release tooling from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Verify stable version and exact main CI
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: node deploy/vercel/release.mjs verify

      - name: Deploy the verified commit to the VPS
        env:
          RELEASE_SHA: ${{ steps.verified.outputs.sha }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/aina_deploy
          chmod 600 ~/.ssh/aina_deploy
          # Pinned host key of the VPS (public); the deploy key itself is limited to deploy/vps/ssh-deploy.sh.
          echo '43.173.33.89 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKM0rQkYurUdY7n6tcr2eo3Vv6wNkzg8IUat/Gw4QmID' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/aina_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes ubuntu@43.173.33.89 "$RELEASE_SHA"

      - name: Check production health
        run: node deploy/vercel/monitor.mjs
