name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

      - name: Run isolated browser regression
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/aina-browser" --ignore-scripts --no-save --no-audit --no-fund @playwright/cli@0.1.22
          export PATH="$RUNNER_TEMP/aina-browser/node_modules/.bin:$PATH"
          pwsh -NoProfile -File tests/Browser/run-isolated.ps1
